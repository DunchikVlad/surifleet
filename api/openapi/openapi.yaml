        - {$ref: '#/components/parameters/PathId'}
      responses:
        '202':
          description: Задача выдана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskInfo'}
        default: {$ref: '#/components/responses/Error'}

  /agents/{id}/actions/redeploy:
    post:
      operationId: redeploy_agent
      tags: [agents]
      summary: Повторный деплой текущего desired state на хост
      description: "Требуется право: agents.actions"
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      responses:
        '202':
          description: Задача выдана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskInfo'}
        default: {$ref: '#/components/responses/Error'}

  /agents/{id}/actions/rollback:
    post:
      operationId: rollback_agent
      tags: [agents]
      summary: Откат правил/конфигурации на хосте на предыдущую рабочую версию
      description: "Требуется право: agents.actions"
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      responses:
        '202':
          description: Задача выдана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskInfo'}
        default: {$ref: '#/components/responses/Error'}

  /agents/{id}/actions/collect_bundle:
    post:
      operationId: collect_agent_bundle
      tags: [agents]
      summary: Собрать диагностический бандл одной кнопкой
      description: "Требуется право: agents.actions. В результате задачи — signed_url архива."
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                include_agent_logs: {type: boolean, default: true}
                include_suricata_logs: {type: boolean, default: true}
                include_configs: {type: boolean, default: true}
                include_system_info: {type: boolean, default: true}
      responses:
        '202':
          description: Задача выдана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskInfo'}
        default: {$ref: '#/components/responses/Error'}

  /agents/{id}/actions/update:
    post:
      operationId: update_agent
      tags: [agents]
      summary: Обновить агента на целевую версию
      description: "Требуется право: agents.update"
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_version]
              properties:
                target_version: {type: string}
      responses:
        '202':
          description: Задача выдана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskInfo'}
        default: {$ref: '#/components/responses/Error'}

  /agents/update_wave:
    post:
      operationId: create_agent_update_wave
      tags: [agents]
      summary: Массовое обновление агентов волнами (canary + batch)
      description: "Требуется право: agents.update. Идемпотентно по Idempotency-Key."
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWaveInput'}
      responses:
        '201':
          description: Волна обновления создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateWave'}
        default: {$ref: '#/components/responses/Error'}

  /agents/{id}/logs:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_agent_logs
      tags: [agents]
      summary: Операционные логи агента (из ClickHouse)
      description: "Требуется право: agents.logs. Фильтры по уровню, периоду, операции; полнотекстовый поиск q."
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: level, in: query, schema: {type: string, enum: [debug, info, warn, error]}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: operation, in: query, description: "Тип операции (deploy, reload, rollback, ...)", schema: {type: string}}
        - {name: q, in: query, description: Поиск по тексту, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentLogPage'}
        default: {$ref: '#/components/responses/Error'}

  /agents/{id}/metrics:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_agent_metrics
      tags: [agents]
      summary: Ряды метрик агента (из ClickHouse)
      description: "Требуется право: agents.read. host.* (cpu/mem/disk) и suricata.* (из eve.json: kernel packets/drops, decoder, flow memuse, alerts, uptime); агент шлёт MetricsBatch каждые 60 с. Ответ: {series: {name: [{ts, value}, ...]}, minutes} — точки по возрастанию ts."
      parameters:
        - {name: minutes, in: query, schema: {type: integer, default: 60, minimum: 1, maximum: 1440}}
        - {name: names, in: query, description: "Фильтр имён через запятую", schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  minutes: {type: integer}
                  series:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          ts: {type: string, format: date-time}
                          value: {type: number}
        default: {$ref: '#/components/responses/Error'}

  /agents/log_level:
    put:
      operationId: set_agents_log_level
      tags: [agents]
      summary: Установить уровень логирования на кластер/хост/агент (без рестарта)
      description: "Требуется право: agents.actions. Ровно один из cluster_id/host_id/agent_id."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogLevelInput'}
      responses:
        '200':
          description: Применено (число затронутых агентов)
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected: {type: integer}
        default: {$ref: '#/components/responses/Error'}

  /agents/compatibility:
    get:
      operationId: get_agents_compatibility
      tags: [agents]
      summary: Матрица совместимости агент↔сервер
      description: "Требуется право: agents.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompatibilityView'}
        default: {$ref: '#/components/responses/Error'}

