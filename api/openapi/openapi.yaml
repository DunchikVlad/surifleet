# ============================================================================
# SuriFleet REST API — OpenAPI 3.0.3
# Все пути под префиксом /api/v1 (см. servers). Конвенции — docs/api.md.
# Аутентификация: JWT access token (bearerAuth) или API-токен (X-API-Key).
# Пагинация везде keyset: limit + cursor → {items, next_cursor}.
# Права указаны в description каждой операции («Требуется право: ...»).
# ============================================================================
openapi: 3.0.3

info:
  title: SuriFleet API
  version: 0.1.0
  description: |
    REST API системы централизованного управления флотом Suricata IDS/IPS.
    Модель флота: организация → кластер → хост → инстанс Suricata (1..N на хост).
    Даты — RFC3339 (date-time). Идентификаторы — UUID.
    Идемпотентность мутирующих POST (деплои, сборка ruleset) — заголовок Idempotency-Key.
  contact:
    name: SuriFleet
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: Единый префикс API (health/version — тоже здесь, без аутентификации)

tags:
  - {name: system, description: Служебные endpoint'ы}
  - {name: auth, description: "Аутентификация, сессии, SSO"}
  - {name: organizations, description: Организации (тенанты)}
  - {name: clusters, description: Кластеры}
  - {name: hosts, description: Хосты и онбординг}
  - {name: instances, description: Инстансы Suricata}
  - {name: rules, description: Мастер-репозиторий правил}
  - {name: feeds, description: Фиды правил и IOC}
  - {name: iocs, description: Индикаторы компрометации}
  - {name: deploy_templates, description: Шаблоны таргетинга деплоя}
  - {name: rulesets, description: Версии ruleset}
  - {name: deployments, description: Волновой деплой}
  - {name: fleet, description: Состояние флота и соответствие (требование А)}
  - {name: agents, description: "Агенты, логи, обновления (требование Б)"}
  - {name: incidents, description: Инциденты}
  - {name: config_profiles, description: Профили конфигурации suricata.yaml}
  - {name: users, description: Пользователи}
  - {name: roles, description: Роли и разрешения}
  - {name: sso_providers, description: SSO-провайдеры (OIDC/SAML/LDAP)}
  - {name: api_tokens, description: API-токены автоматизации}
  - {name: audit, description: Аудит-лог}
  - {name: tasks, description: Статус асинхронных задач агентам}

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:

  # --------------------------------------------------------------------------
  # Служебные
  # --------------------------------------------------------------------------

  /health:
    get:
      operationId: get_health
      tags: [system]
      summary: Состояние сервиса и зависимостей
      security: []
      responses:
        '200':
          description: Сервис жив; components — состояние зависимостей
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default: {$ref: '#/components/responses/Error'}

  /version:
    get:
      operationId: get_version
      tags: [system]
      summary: Версия сервера
      security: []
      responses:
        '200':
          description: Версия и сборка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        default: {$ref: '#/components/responses/Error'}

  # --------------------------------------------------------------------------
  # Аутентификация и сессии
  # --------------------------------------------------------------------------

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Локальный вход (email + пароль, в т.ч. break-glass)
      description: Только для локальных пользователей; SSO-пользователи входят через /auth/sso. Входы break-glass аудируются отдельно.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthTokens'}
        default: {$ref: '#/components/responses/Error'}

  /auth/refresh:
    post:
      operationId: refresh_tokens
      tags: [auth]
      summary: Обновить пару токенов по refresh-токену
      description: Refresh-токен ротируется; для SSO-пользователей здесь же проверяется активность в IdP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthTokens'}
        default: {$ref: '#/components/responses/Error'}

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Завершить сессию (отозвать refresh-токен)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '204': {description: Сессия завершена}
        default: {$ref: '#/components/responses/Error'}

  /auth/sso/providers:
    get:
      operationId: list_sso_providers_public
      tags: [auth]
      summary: Публичный список включённых SSO-провайдеров (для страницы логина)
      security: []
      responses:
        '200':
          description: Список провайдеров
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SsoProviderPublic'}}
        default: {$ref: '#/components/responses/Error'}

  /auth/sso/{provider_id}/login:
    get:
      operationId: start_sso_login
      tags: [auth]
      summary: Начать вход через SSO (redirect в IdP)
      description: OIDC Authorization Code + PKCE (S256). Создаёт одноразовый state+nonce (таблица oidc_states) и возвращает 302 на authorization endpoint провайдера с PKCE-challenge. Callback — общий /auth/sso/callback (state связывает запрос с провайдером).
      security: []
      parameters:
        - {name: provider_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '302':
          description: Перенаправление в IdP
          headers:
            Location: {schema: {type: string}}
        default: {$ref: '#/components/responses/Error'}

  /auth/sso/callback:
    get:
      operationId: sso_callback
      tags: [auth]
      summary: Callback от IdP (GET, code + state)
      description: Одноразовый state (consume, защита от CSRF/replay), обмен code на токены (PKCE), проверка id_token (подпись, issuer, audience, exp, nonce), JIT-провижининг, маппинг групп в роли. На успех — HTML-страница, сохраняющая токен сессии в localStorage и редиректящая в SPA; на ошибку — HTML с текстом (браузерный редирект, не XHR). redirect_url провайдера должен указывать на этот путь.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, description: Отказ IdP, schema: {type: string}}
        - {name: error_description, in: query, schema: {type: string}}
      responses:
        '200':
          description: HTML-страница завершения входа (токен кладётся в localStorage → /app/)
          content:
            text/html: {}
        '401':
          description: HTML с ошибкой входа (отказ IdP, невалидный state, деактивированный пользователь)
          content:
            text/html: {}
        default: {$ref: '#/components/responses/Error'}

  /auth/me:
    get:
      operationId: get_current_user
      tags: [auth]
      summary: Текущий пользователь, его роли и итоговые разрешения
      responses:
        '200':
          description: Профиль и разрешения
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        default: {$ref: '#/components/responses/Error'}

  # --------------------------------------------------------------------------
  # Флот: организации, кластеры, хосты, инстансы
  # --------------------------------------------------------------------------

  /organizations:
    get:
      operationId: list_organizations
      tags: [organizations]
      summary: Список организаций
      description: "Требуется право: organizations.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_organization
      tags: [organizations]
      summary: Создать организацию
      description: "Требуется право: organizations.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        default: {$ref: '#/components/responses/Error'}

  /organizations/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_organization
      tags: [organizations]
      summary: Карточка организации
      description: "Требуется право: organizations.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_organization
      tags: [organizations]
      summary: Изменить организацию
      description: "Требуется право: organizations.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_organization
      tags: [organizations]
      summary: Удалить организацию (каскадно всё содержимое)
      description: "Требуется право: organizations.write"
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  /clusters:
    get:
      operationId: list_clusters
      tags: [clusters]
      summary: Список кластеров
      description: "Требуется право: clusters.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: organization_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClusterPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_cluster
      tags: [clusters]
      summary: Создать кластер
      description: "Требуется право: clusters.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClusterInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cluster'}
        default: {$ref: '#/components/responses/Error'}

  /clusters/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_cluster
      tags: [clusters]
      summary: Карточка кластера
      description: "Требуется право: clusters.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cluster'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_cluster
      tags: [clusters]
      summary: Изменить кластер
      description: "Требуется право: clusters.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClusterUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cluster'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_cluster
      tags: [clusters]
      summary: Удалить кластер
      description: "Требуется право: clusters.write"
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  /clusters/{id}/join_tokens:
    get:
      operationId: list_join_tokens
      tags: [hosts]
      summary: Список join tokens кластера (метаданные, без значений токенов)
      description: "Требуется право: hosts.read. Значения токенов не хранятся и не возвращаются — только SHA-256 хэши в БД."
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinTokenPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_join_token
      tags: [hosts]
      summary: Создать одноразовый join token для онбординга агентов кластера
      description: "Требуется право: hosts.write. Токен показывается один раз в ответе; TTL ограничен."
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinTokenInput'}
      responses:
        '201':
          description: Токен создан (показан один раз)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinToken'}
        default: {$ref: '#/components/responses/Error'}

  /hosts:
    get:
      operationId: list_hosts
      tags: [hosts]
      summary: Список хостов
      description: "Требуется право: hosts.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: cluster_id, in: query, schema: {type: string, format: uuid}}
        - {name: q, in: query, description: Поиск по hostname/IP, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HostPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_host
      tags: [hosts]
      summary: Зарегистрировать хост вручную (обычно хост создаётся enrollment'ом)
      description: "Требуется право: hosts.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HostInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Host'}
        default: {$ref: '#/components/responses/Error'}

  /hosts/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_host
      tags: [hosts]
      summary: Карточка хоста (с агентом и инстансами)
      description: "Требуется право: hosts.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HostDetail'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_host
      tags: [hosts]
      summary: Изменить хост (hostname, labels)
      description: "Требуется право: hosts.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HostUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Host'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_host
      tags: [hosts]
      summary: Удалить хост (агент отвязывается, инстансы удаляются)
      description: "Требуется право: hosts.write"
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  /hosts/{id}/capabilities:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_host_capabilities
      tags: [hosts]
      summary: Capability хоста (6 штук) с учётом наследования от кластера
      description: "Требуется право: hosts.read. Источник значения: default | cluster | host."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilitiesView'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: put_host_capabilities
      tags: [hosts]
      summary: Установить capability хоста (поэтапная передача контроля)
      description: "Требуется право: hosts.write. Передаётся полный целевой набор; изменение фиксируется в аудите, перед деструктивными действиями агент делает бэкап."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilitiesInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilitiesView'}
        default: {$ref: '#/components/responses/Error'}

  /hosts/{id}/discovery:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_host_discovery
      tags: [hosts]
      summary: Последний DiscoveryReport агента (найденные инстансы и бинарь Suricata)
      description: "Требуется право: hosts.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoveryReport'}
        default: {$ref: '#/components/responses/Error'}

  /hosts/{id}/confirm_discovery:
    post:
      operationId: confirm_host_discovery
      tags: [hosts]
      summary: Подтвердить найденные инстансы — создать их под управлением сервера
      description: "Требуется право: hosts.write. Принимает подмножество найденных инстансов; создаёт instances и начальное состояние."
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmDiscoveryInput'}
      responses:
        '201':
          description: Инстансы созданы
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Instance'}}
        default: {$ref: '#/components/responses/Error'}

  /instances:
    get:
      operationId: list_instances
      tags: [instances]
      summary: Список инстансов
      description: "Требуется право: hosts.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: host_id, in: query, schema: {type: string, format: uuid}}
        - {name: cluster_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstancePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_instance
      tags: [instances]
      summary: Добавить инстанс вручную
      description: "Требуется право: hosts.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstanceInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instance'}
        default: {$ref: '#/components/responses/Error'}

  /instances/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_instance
      tags: [instances]
      summary: Карточка инстанса
      description: "Требуется право: hosts.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instance'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_instance
      tags: [instances]
      summary: Изменить инстанс (пути, интерфейсы, systemd unit)
      description: "Требуется право: hosts.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstanceUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instance'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_instance
      tags: [instances]
      summary: Удалить инстанс из-под управления
      description: "Требуется право: hosts.write"
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  # --------------------------------------------------------------------------
  # Правила
  # --------------------------------------------------------------------------

  /rules:
    get:
      operationId: list_rules
      tags: [rules]
      summary: Список правил мастер-репозитория
      description: "Требуется право: rules.read. Фильтры комбинируются (AND)."
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {type: string, enum: [enabled, disabled, expired, under_review, deleted]}}
        - {name: category, in: query, schema: {type: string}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: source, in: query, description: 'Источник: file | feed | ioc | et_open | et_pro', schema: {type: string, enum: [file, feed, ioc, et_open, et_pro]}}
        - {name: sid, in: query, schema: {type: integer, format: int64}}
        - {name: q, in: query, description: Поиск по msg, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RulePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_rule
      tags: [rules]
      summary: Создать правило вручную
      description: "Требуется право: rules.write. Сырой текст парсится и валидируется; создаётся первая ревизия."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rule'}
        default: {$ref: '#/components/responses/Error'}

  /rules/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_rule
      tags: [rules]
      summary: Карточка правила
      description: "Требуется право: rules.read"
      responses:
        '200':
