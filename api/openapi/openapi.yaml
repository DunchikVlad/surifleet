      summary: История версий профиля
      description: "Требуется право: config.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigProfileVersionPage'}
        default: {$ref: '#/components/responses/Error'}

  /config_profiles/{id}/versions/diff:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: diff_config_profile_versions
      tags: [config_profiles]
      summary: Diff двух версий профиля (unified diff)
      description: "Требуется право: config.read"
      parameters:
        - {name: from, in: query, required: true, schema: {type: integer}}
        - {name: to, in: query, required: true, schema: {type: integer}}
      responses:
        '200':
