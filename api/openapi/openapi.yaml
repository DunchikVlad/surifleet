    post:
      operationId: rollback_config_profile
      tags: [config_profiles]
      summary: Откат профиля на указанную версию (создаёт новую версию)
      description: "Требуется право: config.write"
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigProfile'}
        default: {$ref: '#/components/responses/Error'}

