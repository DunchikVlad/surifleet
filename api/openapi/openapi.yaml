            schema: {$ref: '#/components/schemas/ConfigProfileUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigProfile'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_config_profile
      tags: [config_profiles]
      summary: Удалить профиль
      description: "Требуется право: config.write"
      responses:
        '204': {description: Удалено}
