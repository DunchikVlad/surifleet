    post:
      operationId: create_config_profile
      tags: [config_profiles]
      summary: Создать профиль конфигурации
      description: "Требуется право: config.write. Наследование: кластер → хост → инстанс (parent_id)."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigProfileInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigProfile'}
        default: {$ref: '#/components/responses/Error'}

  /config_profiles/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_config_profile
      tags: [config_profiles]
      summary: Карточка профиля
      description: "Требуется право: config.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigProfile'}
        default: {$ref: '#/components/responses/Error'}
    patch:
