  /deployments/{id}/resume:
    post:
      operationId: resume_deployment
      tags: [deployments]
      summary: Продолжить приостановленный или завершившийся ошибкой деплой
      description: "Resume из paused или failed: failed-задачи переводятся в pending и прогоняются заново. Требуется право: deployments.control"
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        default: {$ref: '#/components/responses/Error'}

  /deployments/{id}/cancel:
    post:
      operationId: cancel_deployment
      tags: [deployments]
      summary: Отменить деплой (невыданные задачи отменяются)
      description: "Требуется право: deployments.control"
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        default: {$ref: '#/components/responses/Error'}

  /deployments/{id}/rollback:
    post:
      operationId: rollback_deployment
      tags: [deployments]
      summary: "Откат: создать обратный деплой на предыдущую рабочую версию"
      description: "Требуется право: deployments.control. Возвращает новый деплой-откат на затронутые инстансы."
      parameters:
        - {$ref: '#/components/parameters/PathId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201':
          description: Создан деплой-откат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        default: {$ref: '#/components/responses/Error'}

  /deployments/{id}/tasks:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: list_deployment_tasks
      tags: [deployments]
      summary: Задачи деплоя по инстансам
      description: "Требуется право: deployments.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {type: string, enum: [pending, sent, running, succeeded, failed, cancelled, skipped]}}
        - {name: wave, in: query, schema: {type: integer}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentTaskPage'}
        default: {$ref: '#/components/responses/Error'}

  /fleet/compliance:
    get:
      operationId: get_fleet_compliance
      tags: [fleet]
      summary: Глобальная сводка флота по статусам соответствия с drill-down
      description: "Требуется право: fleet.read. Без фильтра status возвращает только сводку; с фильтром — страницу инстансов этого статуса. Цель производительности: < 2 с на 10k инстансов."
      parameters:
        - {name: cluster_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, description: Drill-down по статусу, schema: {type: string, enum: [in_sync, pending, partial, drift, stale]}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Сводка + опциональная страница инстансов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetCompliance'}
        default: {$ref: '#/components/responses/Error'}

  /instances/{id}/state:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_instance_state
      tags: [fleet]
      summary: Desired vs actual состояние инстанса, статус соответствия и diff
      description: "Требуется право: fleet.read. Включает reported_at — «данные актуальны на»."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstanceState'}
        default: {$ref: '#/components/responses/Error'}

  /instances/{id}/deploy_history:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_instance_deploy_history
      tags: [fleet]
      summary: История деплоев инстанса (версия, время, инициатор, результат)
      description: "Требуется право: fleet.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeployHistoryPage'}
        default: {$ref: '#/components/responses/Error'}

  /matrix/rules:
    get:
      operationId: get_rules_matrix
      tags: [fleet]
      summary: Матрица «правила × инстансы» (виртуализированная, keyset по обоим измерениям)
      description: "Требуется право: fleet.read. Ячейка — статус правила на инстансе: loaded | failed | missing | extra. Независимые курсоры по осям."
      parameters:
        - {name: rule_status, in: query, description: Фильтр правил по статусу в репозитории, schema: {type: string, enum: [enabled, disabled, expired, under_review, deleted]}}
        - {name: category, in: query, schema: {type: string}}
        - {name: sid, in: query, schema: {type: integer, format: int64}}
        - {name: cluster_id, in: query, schema: {type: string, format: uuid}}
        - {name: cell_status, in: query, description: Только ячейки со статусом, schema: {type: string, enum: [loaded, failed, missing, extra]}}
        - {name: rule_cursor, in: query, description: Keyset-курсор по оси правил, schema: {type: string}}
        - {name: instance_cursor, in: query, description: Keyset-курсор по оси инстансов, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100, minimum: 1, maximum: 1000}}
      responses:
        '200':
          description: Оси и страница ячеек
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RulesMatrix'}
        default: {$ref: '#/components/responses/Error'}

  # --------------------------------------------------------------------------
  # Агенты и инциденты (ключевое требование Б)
  # --------------------------------------------------------------------------

  /agents:
    get:
      operationId: list_agents
      tags: [agents]
      summary: Список агентов
      description: "Требуется право: agents.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {type: string, enum: [online, degraded, offline, updating, error]}}
        - {name: version, in: query, description: Версия агента, schema: {type: string}}
        - {name: cluster_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPage'}
        default: {$ref: '#/components/responses/Error'}

  /agents/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_agent
      tags: [agents]
      summary: Карточка агента (версии, сертификат, статус, last seen)
      description: "Требуется право: agents.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        default: {$ref: '#/components/responses/Error'}

  /agents/{id}/actions/restart:
    post:
      operationId: restart_agent
      tags: [agents]
      summary: Перезапустить агента
