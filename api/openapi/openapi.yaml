        - {name: q, in: query, description: Поиск по email/имени, schema: {type: string}}
        - {name: is_active, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_user
      tags: [users]
      summary: Создать локального пользователя
      description: "Требуется право: users.write. SSO-пользователи создаются автоматически (JIT) при первом входе."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}

  /users/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_user
      tags: [users]
      summary: Карточка пользователя (с ролями и scoping)
      description: "Требуется право: users.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_user
      tags: [users]
      summary: Изменить пользователя (активность, роли)
      description: "Требуется право: users.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_user
      tags: [users]
      summary: Удалить пользователя
      description: "Требуется право: users.write. Break-glass администратор не может быть удалён последним."
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  /users/{id}/revoke_sessions:
    post:
      operationId: revoke_user_sessions
      tags: [users]
      summary: Отозвать все сессии пользователя (принудительный logout)
      description: "Требуется право: users.write"
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      responses:
        '204': {description: Сессии отозваны}
        default: {$ref: '#/components/responses/Error'}

  /roles:
    get:
      operationId: list_roles
      tags: [roles]
      summary: Список ролей (встроенные + кастомные)
      description: "Требуется право: roles.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RolePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_role
      tags: [roles]
      summary: Создать кастомную роль
      description: "Требуется право: roles.write. permissions — массив строк вида rules.read."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        default: {$ref: '#/components/responses/Error'}

  /roles/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_role
      tags: [roles]
      summary: Карточка роли
      description: "Требуется право: roles.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_role
      tags: [roles]
      summary: Изменить кастомную роль
      description: "Требуется право: roles.write. Встроенные роли неизменяемы."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_role
      tags: [roles]
      summary: Удалить кастомную роль
      description: "Требуется право: roles.write"
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  /sso_providers:
    get:
      operationId: list_sso_providers
      tags: [sso_providers]
      summary: Список SSO-провайдеров организации
      description: "Требуется право: sso.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SsoProviderPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_sso_provider
      tags: [sso_providers]
      summary: Подключить SSO-провайдера (OIDC/SAML/LDAP)
      description: "Требуется право: sso.write. Секреты (client_secret и т.п.) — write-only, хранятся шифрованно и никогда не возвращаются."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SsoProviderInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SsoProvider'}
        default: {$ref: '#/components/responses/Error'}

  /sso_providers/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_sso_provider
      tags: [sso_providers]
      summary: Карточка провайдера (без секретов)
      description: "Требуется право: sso.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SsoProvider'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_sso_provider
      tags: [sso_providers]
      summary: Изменить провайдера
      description: "Требуется право: sso.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SsoProviderUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SsoProvider'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_sso_provider
      tags: [sso_providers]
      summary: Удалить провайдера
      description: "Требуется право: sso.write. JIT-пользователи сохраняются (provider_id → NULL), но войти через этот SSO больше не смогут."
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  /api_tokens:
    get:
      operationId: list_api_tokens
      tags: [api_tokens]
      summary: Список API-токенов
      description: "Требуется право: tokens.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_api_token
      tags: [api_tokens]
      summary: Выпустить API-токен
      description: "Требуется право: tokens.write. Значение токена возвращается один раз в поле token."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenInput'}
      responses:
        '201':
          description: Токен создан (значение показано один раз)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenCreated'}
        default: {$ref: '#/components/responses/Error'}

  /api_tokens/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    delete:
      operationId: revoke_api_token
      tags: [api_tokens]
      summary: Отозвать API-токен
      description: "Требуется право: tokens.write"
      responses:
        '204': {description: Отозван}
        default: {$ref: '#/components/responses/Error'}

  /audit_log:
    get:
      operationId: list_audit_log
      tags: [audit]
      summary: Аудит-лог (append-only, поиск и фильтрация)
      description: "Требуется право: audit.read. Keyset по (created_at, id); порядок — от новых к старым."
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: actor, in: query, description: email/имя актора или id, schema: {type: string}}
        - {name: action, in: query, description: 'Например: rules.create', schema: {type: string}}
        - {name: object_type, in: query, schema: {type: string}}
        - {name: result, in: query, schema: {type: string, enum: [success, denied, error]}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditLogPage'}
        default: {$ref: '#/components/responses/Error'}

  /audit_log/export:
    get:
      operationId: export_audit_log
      tags: [audit]
      summary: Экспорт аудит-лога за период (CSV или JSON)
      description: "Требуется право: audit.read"
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: format, in: query, schema: {type: string, enum: [csv, json], default: csv}}
      responses:
        '200':
          description: Файл экспорта
          content:
            text/csv: {}
            application/json: {}
        default: {$ref: '#/components/responses/Error'}

  /audit_log/verify:
    get:
      operationId: verify_audit_chain
      tags: [audit]
      summary: Проверка целостности цепочки хэшей (prev_hash→hash)
      description: "Требуется право: audit.read. Пересчитывает hash из prev_hash+полей (подделка полей ломает совпадение) и связность prev_hash_i == hash_(i-1) (удаление/вставка ломает звено) для последних limit записей. Цепочка включается server.audit_hash_chain=true (чанк 38)."
      parameters:
        - {name: limit, in: query, description: 'Сколько свежих записей проверить (default 1000, max 100000)', schema: {type: integer, minimum: 1, maximum: 100000}}
      responses:
        '200':
          description: Итог проверки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChainVerifyResult'}
        default: {$ref: '#/components/responses/Error'}

  # --------------------------------------------------------------------------
  # Асинхронные задачи агентам
  # --------------------------------------------------------------------------

  /tasks/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_task
      tags: [tasks]
      summary: Статус асинхронной задачи агенту (результат actions/*, validate и т.п.)
      description: "Требуется право: agents.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskInfo'}
        default: {$ref: '#/components/responses/Error'}

# ============================================================================
# Компоненты
# ============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Сессионный токен (непрозрачный; MVP чанка 28 — access и refresh совпадают, refresh ротирует; JWT — позже)
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API-токен автоматизации (scopes при выпуске)

  parameters:
    Limit:
      name: limit
      in: query
      description: Размер страницы (keyset)
      schema: {type: integer, default: 100, minimum: 1, maximum: 1000}
    Cursor:
      name: cursor
      in: query
      description: Keyset-курсор из поля next_cursor предыдущего ответа
      schema: {type: string}
    PathId:
      name: id
      in: path
      required: true
      description: UUID ресурса
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Ключ идемпотентности (UUID); повтор с тем же ключом возвращает исходный результат
      schema: {type: string}

  responses:
    Error:
      description: Единый формат ошибки
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:

    # ------ Общие ------

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: 'Машиночитаемый код: validation_failed | unauthorized | forbidden | not_found | conflict | rate_limited | internal | ...'}
            message: {type: string, description: Человекочитаемое описание}
            details: {type: object, description: "Контекст ошибки (поля формы, причина отказа)", nullable: true}

    Health:
      type: object
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string}
        components:
          type: object
          description: 'Состояние зависимостей: ok | degraded | down'
          properties:
            postgres: {type: string}
            redis: {type: string}
            nats: {type: string}
            s3: {type: string}
            clickhouse: {type: string}

    Version:
      type: object
      properties:
        version: {type: string}
        commit: {type: string}
        build_date: {type: string}
        min_supported_agent_version: {type: string}

    TaskInfo:
      type: object
      description: Статус асинхронной задачи агенту
      properties:
        task_id: {type: string, format: uuid}
        type: {type: string}
        status: {type: string, enum: [pending, sent, running, succeeded, failed, cancelled]}
        error: {type: string, nullable: true}
        result: {type: object, nullable: true, description: 'Детали результата, напр. {"signed_url": "..."} для бандла'}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}

    # ------ Аутентификация ------

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string}

    AuthTokens:
      type: object
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, description: "Срок жизни access token, секунды"}

    SsoProviderPublic:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [oidc, saml, ldap]}

    CurrentUser:
      type: object
      properties:
        user: {$ref: '#/components/schemas/User'}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        permissions: {type: array, items: {type: string}, description: 'Итоговый набор разрешений: rules.read, deployments.create, ...'}

    # ------ Флот ------

    Organization:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        description: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    OrganizationInput:
      type: object
      required: [name, slug]
      properties:
        name: {type: string}
        slug: {type: string}
        description: {type: string}

    OrganizationUpdateInput:
      type: object
      properties:
        name: {type: string}
        description: {type: string}

    Cluster:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ClusterInput:
      type: object
      required: [organization_id, name]
      properties:
        organization_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}

    ClusterUpdateInput:
      type: object
      properties:
        name: {type: string}
        description: {type: string}

    Host:
      type: object
      properties:
        id: {type: string, format: uuid}
        cluster_id: {type: string, format: uuid}
        hostname: {type: string}
        ip_addresses: {type: array, items: {type: string}}
        os: {type: string, nullable: true}
        labels: {type: object, additionalProperties: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    HostDetail:
      allOf:
        - {$ref: '#/components/schemas/Host'}
        - type: object
          properties:
            agent: {$ref: '#/components/schemas/Agent'}
            instances: {type: array, items: {$ref: '#/components/schemas/Instance'}}

    HostInput:
      type: object
      required: [cluster_id, hostname]
      properties:
        cluster_id: {type: string, format: uuid}
        hostname: {type: string}
        ip_addresses: {type: array, items: {type: string}}
        os: {type: string}
        labels: {type: object, additionalProperties: {type: string}}

    HostUpdateInput:
      type: object
      properties:
        hostname: {type: string}
        labels: {type: object, additionalProperties: {type: string}}

    Instance:
      type: object
      properties:
        id: {type: string, format: uuid}
        host_id: {type: string, format: uuid}
        name: {type: string}
        config_path: {type: string}
        rules_dir: {type: string}
        log_dir: {type: string}
        capture_interfaces: {type: array, items: {type: string}}
        suricata_version: {type: string, nullable: true}
        systemd_unit: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    InstanceInput:
      type: object
      required: [host_id, name, config_path, rules_dir, log_dir]
      properties:
        host_id: {type: string, format: uuid}
        name: {type: string}
        config_path: {type: string}
        rules_dir: {type: string}
        log_dir: {type: string}
        capture_interfaces: {type: array, items: {type: string}}
        systemd_unit: {type: string}

    InstanceUpdateInput:
      type: object
      properties:
        name: {type: string}
        config_path: {type: string}
        rules_dir: {type: string}
        log_dir: {type: string}
        capture_interfaces: {type: array, items: {type: string}}
        systemd_unit: {type: string}

    CapabilityItem:
      type: object
      properties:
        capability: {type: string, enum: [monitoring, rules, log_rotation, service_mgmt, packages, config]}
        enabled: {type: boolean}
        source: {type: string, enum: [default, cluster, host], description: Откуда унаследовано значение}

    CapabilitiesView:
      type: object
      properties:
        host_id: {type: string, format: uuid}
        capabilities: {type: array, items: {$ref: '#/components/schemas/CapabilityItem'}}

    CapabilitiesInput:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          description: Полный целевой набор (отсутствующие capability считаются отключёнными)
          items:
            type: object
            required: [capability, enabled]
            properties:
              capability: {type: string, enum: [monitoring, rules, log_rotation, service_mgmt, packages, config]}
              enabled: {type: boolean}

    JoinTokenInput:
      type: object
      properties:
        ttl_seconds: {type: integer, default: 3600, maximum: 86400}
        comment: {type: string}

    JoinToken:
      type: object
      properties:
        token: {type: string, description: Показывается один раз}
        cluster_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    JoinTokenEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        cluster_id: {type: string, format: uuid}
        name: {type: string}
        expires_at: {type: string, format: date-time}
        used_at: {type: string, format: date-time, nullable: true}
        max_uses: {type: integer}
        use_count: {type: integer}
        created_at: {type: string, format: date-time}

    JoinTokenPage: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/JoinTokenEntry'}}, next_cursor: {type: string, nullable: true}}}

    DiscoveredInstance:
      type: object
      properties:
        name: {type: string}
        config_path: {type: string}
        rules_dir: {type: string}
        log_dir: {type: string}
        capture_interfaces: {type: array, items: {type: string}}
        suricata_version: {type: string}
        build_flags: {type: string}
        systemd_unit: {type: string}

    DiscoveryReport:
      type: object
      properties:
        host_id: {type: string, format: uuid}
        received_at: {type: string, format: date-time}
        instances: {type: array, items: {$ref: '#/components/schemas/DiscoveredInstance'}}
        binary:
          type: object
          properties:
            path: {type: string}
            version: {type: string}
            built_from_source: {type: boolean}

    ConfirmDiscoveryInput:
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          description: Подмножество найденных инстансов, подтверждённое пользователем
          items: {$ref: '#/components/schemas/DiscoveredInstance'}

    # ------ Правила, фиды, IOC ------

    Rule:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        sid: {type: integer, format: int64}
        msg: {type: string, nullable: true}
        category: {type: string, nullable: true}
        tags: {type: array, items: {type: string}}
        status: {type: string, enum: [enabled, disabled, expired, under_review, deleted]}
        priority: {type: integer, nullable: true, description: Тюнинг аналитика}
        threshold: {type: object, nullable: true, description: Тюнинг аналитика (threshold/suppress)}
        source_type: {type: string, enum: [file, feed, ioc, et_open, et_pro]}
        feed_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    RuleInput:
      type: object
      required: [raw]
      properties:
        raw: {type: string, description: Сырой текст правила (sid берётся из него)}
        category: {type: string}
        tags: {type: array, items: {type: string}}
        status: {type: string, enum: [enabled, disabled, under_review], default: under_review}
        priority: {type: integer}
        threshold: {type: object}

    RuleUpdateInput:
      type: object
      properties:
        category: {type: string}
        tags: {type: array, items: {type: string}}
        status: {type: string, enum: [enabled, disabled, expired, under_review, deleted]}
        priority: {type: integer}
        threshold: {type: object}

    RuleFilter:
      type: object
      properties:
        status: {type: string, enum: [enabled, disabled, expired, under_review, deleted]}
        category: {type: string}
        tag: {type: string}
        source: {type: string, enum: [file, feed, ioc]}
        feed_id: {type: string, format: uuid}

    RuleRevision:
      type: object
      properties:
        id: {type: string, format: uuid}
        rule_id: {type: string, format: uuid}
        sid: {type: integer, format: int64}
        revision: {type: integer}
        raw: {type: string}
        hash: {type: string, description: sha256}
        created_at: {type: string, format: date-time}

    RuleHistoryItem:
      type: object
      properties:
        ts: {type: string, format: date-time}
        actor_name: {type: string, nullable: true}
        action: {type: string, description: 'import | tune | status_change | feed_update | ...'}
        details: {type: object, nullable: true}

    ImportResult:
      type: object
      properties:
        imported: {type: integer, description: Новых объектов}
        updated: {type: integer, description: Обновлено существующих (raw изменился → новая ревизия)}
        unchanged: {type: integer, description: Без изменений (raw совпал с последней ревизией)}
        errors:
          type: array
          description: Ошибки парсинга (первые 100), импорт остальных строк не прерывается
          items:
            type: object
            properties:
              line: {type: integer, description: Номер строки файла}
              reason: {type: string, description: Причина}
        total_lines: {type: integer, description: Физических строк прочитано (включая комментарии/пустые)}

    BulkRequest:
      type: object
      required: [action]
      properties:
        ids: {type: array, items: {type: string, format: uuid}, description: Явный список; приоритетнее filter}
        filter: {$ref: '#/components/schemas/RuleFilter'}
        action: {type: string, enum: [enable, disable, delete, set_priority, add_tag, remove_tag]}
        params:
          type: object
          description: 'Параметры действия: {"priority": 1} или {"tag": "c2"}'
          properties:
            priority: {type: integer}
            tag: {type: string}

    BulkResult:
      type: object
      properties:
        affected: {type: integer}

    Feed:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [et_open, et_pro, taxii, stix, misp, generic]}
        url: {type: string}
        schedule: {type: string, nullable: true, description: 'Интервал авто-синка: длительность Go ("1h", "30m" — от last_sync_at) или 5-полевой cron ("*/15 * * * *", @daily; локальное время сервера)'}
        enabled: {type: boolean}
        last_sync_at: {type: string, format: date-time, nullable: true}
        last_sync_status: {type: string, nullable: true, description: 'success | failed'}
        last_error: {type: string, nullable: true, description: Текст ошибки/частичного успеха последнего синка}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    FeedInput:
      type: object
      required: [name, type, url]
      properties:
        name: {type: string}
        type: {type: string, enum: [et_open, et_pro, taxii, stix, misp, generic]}
        url: {type: string, description: 'Абсолютный URL http(s). Для et_open может быть пустой строкой — подставляется дефолт https://rules.emergingthreats.net/open/suricata/rules/emerging-all.rules (или URL отдельной категории/свой .rules-файл). Для et_pro тоже может быть пустой — URL строится при синке из кода подписки (credentials): https://rules.emergingthreatspro.com/<code>/suricata/rules/etpro-all.rules'}
        schedule: {type: string, description: 'Интервал авто-синка: длительность Go ("1h") или 5-полевой cron ("*/15 * * * *")'}
        credentials: {type: string, writeOnly: true, description: 'Креды доступа: "user:pass" → Basic Auth, иначе Bearer-токен; для et_pro — код подписки ET Pro (просто код, без user:pass), подставляется в URL. Хранятся шифрованно'}
        enabled: {type: boolean, default: true}

    FeedUpdateInput:
      type: object
      properties:
        name: {type: string}
        url: {type: string}
        schedule: {type: string}
        credentials: {type: string, writeOnly: true}
        enabled: {type: boolean}

    FeedRun:
      type: object
      description: 'Запуск синхронизации фида. Поля rules_* и ruleset_version — только в ответе POST /feeds/{id}/sync (итог автопрогона генерации правил из IOC; выполняется лишь для IOC-фидов generic, taxii, stix и misp), в истории runs не хранятся. Для et_open/et_pro счётчики imported/updated/skipped относятся к правилам (новые sid / изменившийся raw / битые строки); правила без изменений в счётчики не входят, их число — в error-сообщении при успехе.'
      properties:
        id: {type: string, format: uuid}
        feed_id: {type: string, format: uuid}
        status: {type: string, enum: [running, success, failed]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        imported: {type: integer}
        updated: {type: integer}
        skipped: {type: integer, description: Некорректные записи фида (не прерывают импорт)}
        error: {type: string, nullable: true}
        rules_created: {type: integer, description: 'Только в ответе sync: новые правила из IOC'}
        rules_updated: {type: integer, description: 'Только в ответе sync: обновлённые правила'}
        rules_unchanged: {type: integer, description: 'Только в ответе sync: правила без изменений'}
        ruleset_version: {type: string, description: 'Только в ответе sync: собранная версия ruleset ioc-current-*'}

    Ioc:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        type: {type: string, enum: [ip, domain, url, md5, sha1, sha256, email]}
        value: {type: string}
        score: {type: integer}
        status: {type: string, enum: [active, under_review, expired, revoked]}
        feed_id: {type: string, format: uuid, nullable: true}
        source: {type: string, nullable: true}
        expires_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    IocInput:
      type: object
      required: [type, value]
      properties:
        type: {type: string, enum: [ip, domain, url, md5, sha1, sha256, email]}
        value: {type: string}
        score: {type: integer, default: 0, minimum: 0, maximum: 100}
        source: {type: string, nullable: true, description: 'Источник (manual / имя фида); для POST /iocs/import — дефолт верхнего уровня'}
        expires_at: {type: string, format: date-time}

    IocUpdateInput:
      type: object
      properties:
        score: {type: integer, minimum: 0, maximum: 100}
        status: {type: string, enum: [active, under_review, expired, revoked]}
        source: {type: string, nullable: true}
        expires_at: {type: string, format: date-time}

    IocGenerateInput:
      type: object
      properties:
        deploy: {type: boolean, default: false, description: 'Сразу задеплоить собранный ruleset (требует targeting)'}
        targeting: {$ref: '#/components/schemas/Targeting'}
        batch_size: {type: integer, default: 50}
        concurrency: {type: integer, default: 10}
        canary_size: {type: integer, default: 1}

    IocGenerateResult:
      type: object
      properties:
        swept_expired: {type: integer, description: IOC, погашенные свипом перед генерацией}
        revoked: {type: integer, description: 'IOC-правила, отключённые при свипе просроченных (чанк 19)'}
        active: {type: integer, description: Всего активных IOC}
        created: {type: integer, description: Новые правила}
        updated: {type: integer, description: Правила с изменившимся raw}
        unchanged: {type: integer, description: Идемпотентный повтор (без изменений)}
        skipped:
          type: array
          description: IOC без правила (hash/email/битый url) с причиной
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              type: {type: string}
              value: {type: string}
              reason: {type: string}
        ruleset_id: {type: string, format: uuid, nullable: true, description: 'Версия ruleset "ioc-current" (null — ioc-правил нет)'}
        ruleset_version: {type: string}
        ruleset_created: {type: boolean, description: true — новая версия; false — состав не изменился}
        rules_count: {type: integer}
        deployment_id: {type: string, format: uuid, nullable: true, description: 'Созданный деплой (только при deploy=true)'}

    # ------ Деплой и состояние ------

    Targeting:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all_clusters, selected_clusters, all_except_clusters, specific_hosts, specific_instances]
        cluster_ids: {type: array, items: {type: string, format: uuid}}
        host_ids: {type: array, items: {type: string, format: uuid}}
        instance_ids: {type: array, items: {type: string, format: uuid}}

    DeployTemplate:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        targeting: {$ref: '#/components/schemas/Targeting'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    DeployTemplateInput:
      type: object
      required: [name, targeting]
      properties:
        name: {type: string}
        description: {type: string}
        targeting: {$ref: '#/components/schemas/Targeting'}

    RulesetVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        version: {type: string}
        sha256: {type: string, description: Content-addressed хэш блоба в S3}
        rule_count: {type: integer}
        created_by: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}

    RulesetVersionDetail:
      allOf:
        - {$ref: '#/components/schemas/RulesetVersion'}
        - type: object
          properties:
            manifest: {type: object, description: 'Состав версии: ссылки на правила/ревизии'}

    RulesetBuildInput:
      type: object
      required: [version]
      properties:
        version: {type: string, description: Человекочитаемая версия (semver или метка)}
        rule_filter: {$ref: '#/components/schemas/RuleFilter', description: По умолчанию — все enabled правила}
        rule_ids: {type: array, items: {type: string, format: uuid}, description: Явный список id правил; имеет приоритет над rule_filter (фильтр при этом не применяется)}
        note: {type: string}

    Deployment:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        ruleset_version_id: {type: string, format: uuid}
        deploy_template_id: {type: string, format: uuid, nullable: true}
        targeting: {$ref: '#/components/schemas/Targeting'}
        batch_size: {type: integer}
        concurrency: {type: integer}
        canary_size: {type: integer}
        status: {type: string, enum: [pending, running, paused, completed, failed, cancelled]}
        initiated_by: {type: string, format: uuid, nullable: true}
        progress: {$ref: '#/components/schemas/DeploymentProgress'}
        started_at: {type: string, format: date-time, nullable: true}
        paused_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    DeploymentProgress:
      type: object
      properties:
        total: {type: integer}
        pending: {type: integer}
        running: {type: integer}
        succeeded: {type: integer}
        failed: {type: integer}
        current_wave: {type: integer}

    DeploymentInput:
      type: object
      required: [ruleset_id, targeting]
      properties:
        ruleset_id: {type: string, format: uuid}
        deploy_template_id: {type: string, format: uuid, nullable: true, description: Шаблон-источник таргетинга (аудит)}
        targeting: {$ref: '#/components/schemas/Targeting'}
        batch_size: {type: integer, default: 50, minimum: 1}
        concurrency: {type: integer, default: 10, minimum: 1}
        canary_size: {type: integer, default: 1, minimum: 0}

    DeploymentTask:
      type: object
      properties:
        id: {type: string, format: uuid}
        deployment_id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        wave: {type: integer}
        status: {type: string, enum: [pending, sent, running, succeeded, failed, cancelled, skipped]}
        attempts: {type: integer}
        error: {type: string, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}

    ComplianceSummary:
      type: object
      properties:
        total_instances: {type: integer}
        by_status:
          type: object
          properties:
            in_sync: {type: integer}
            pending: {type: integer}
            partial: {type: integer}
            drift: {type: integer}
            stale: {type: integer}

    ComplianceItem:
      type: object
      properties:
        instance_id: {type: string, format: uuid}
        host_id: {type: string, format: uuid}
        hostname: {type: string}
        cluster_id: {type: string, format: uuid}
        status: {type: string, enum: [in_sync, pending, partial, drift, stale]}
        updated_at: {type: string, format: date-time}

    FleetCompliance:
      type: object
      properties:
        summary: {$ref: '#/components/schemas/ComplianceSummary'}
        items: {type: array, items: {$ref: '#/components/schemas/ComplianceItem'}, description: Заполняется при drill-down (фильтр status)}
        next_cursor: {type: string, nullable: true}

    FailedRule:
      type: object
      properties:
        sid: {type: integer, format: int64}
        rev: {type: integer}
        error_text: {type: string}

    InstanceState:
      type: object
      description: Desired vs actual + статус соответствия + diff
      properties:
        instance_id: {type: string, format: uuid}
        desired:
          type: object
          properties:
            ruleset_version_id: {type: string, format: uuid}
            ruleset_hash: {type: string}
            calc_version: {type: integer, format: int64}
            updated_at: {type: string, format: date-time}
        actual:
          type: object
          nullable: true
          properties:
            ruleset_hash: {type: string}
            loaded_count: {type: integer}
            failed_count: {type: integer}
            failed_rules: {type: array, items: {$ref: '#/components/schemas/FailedRule'}}
            last_reload:
              type: object
              nullable: true
              properties:
                action: {type: string, enum: [reload, restart]}
                success: {type: boolean}
                finished_at: {type: string, format: date-time}
            reported_at: {type: string, format: date-time, description: '«Данные актуальны на»'}
        compliance:
          type: object
          properties:
            status: {type: string, enum: [in_sync, pending, partial, drift, stale]}
            details: {type: object}
            updated_at: {type: string, format: date-time}
        diff:
          type: object
          description: Расхождение desired/actual (для статусов partial/drift)
          properties:
            missing_rules: {type: array, items: {type: integer, format: int64}, description: "sid, которые должны быть, но не загружены"}
            extra_rules: {type: array, items: {type: integer, format: int64}, description: "sid, загруженные вне desired"}
            failed_rules: {type: array, items: {$ref: '#/components/schemas/FailedRule'}}

    DeployHistoryItem:
      type: object
      properties:
        deployment_id: {type: string, format: uuid}
        ruleset_version: {type: string}
        initiated_by: {type: string, nullable: true}
        status: {type: string}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        result: {type: string, nullable: true}

    RulesMatrix:
      type: object
      description: Страница матрицы «правила × инстансы»; курсоры по осям независимы
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              sid: {type: integer, format: int64}
              msg: {type: string}
              status: {type: string}
        instances:
          type: array
          items:
            type: object
            properties:
              instance_id: {type: string, format: uuid}
              hostname: {type: string}
              name: {type: string}
        cells:
          type: array
          items:
            type: object
            properties:
              sid: {type: integer, format: int64}
              instance_id: {type: string, format: uuid}
              status: {type: string, enum: [loaded, failed, missing, extra]}
        next_rule_cursor: {type: string, nullable: true}
        next_instance_cursor: {type: string, nullable: true}

    # ------ Агенты и инциденты ------

    Agent:
      type: object
      properties:
        id: {type: string, format: uuid}
        host_id: {type: string, format: uuid}
        hostname: {type: string, description: Денормализовано для списков}
        cluster_id: {type: string, format: uuid, description: Денормализовано для фильтров}
        agent_version: {type: string, nullable: true}
        protocol_version: {type: integer, nullable: true}
        status: {type: string, enum: [online, degraded, offline, updating, error]}
        last_seen_at: {type: string, format: date-time, nullable: true}
        cert_serial: {type: string, nullable: true}
        cert_expires_at: {type: string, format: date-time, nullable: true}
        enrolled_at: {type: string, format: date-time, nullable: true}

    AgentLogEntry:
      type: object
      properties:
        seq: {type: integer, format: int64}
        ts: {type: string, format: date-time}
        level: {type: string, enum: [debug, info, warn, error]}
        msg: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}

    LogLevelInput:
      type: object
      required: [level]
      properties:
        level: {type: string, enum: [debug, info, warn, error]}
        cluster_id: {type: string, format: uuid, description: Ровно один из cluster_id/host_id/agent_id}
        host_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}

    UpdateWaveInput:
      type: object
      required: [target_version]
      properties:
        target_version: {type: string}
        cluster_ids: {type: array, items: {type: string, format: uuid}, description: Пусто — все кластеры}
        agent_ids: {type: array, items: {type: string, format: uuid}, description: Явный список; приоритетнее cluster_ids}
        batch_size: {type: integer, default: 50, minimum: 1}
        concurrency: {type: integer, default: 10, minimum: 1}
        canary_size: {type: integer, default: 1, minimum: 0}

    UpdateWave:
      type: object
      properties:
        id: {type: string, format: uuid}
        target_version: {type: string}
        status: {type: string, enum: [pending, running, paused, completed, failed, cancelled]}
        total: {type: integer}
        completed: {type: integer}
        failed: {type: integer}
        created_at: {type: string, format: date-time}

    CompatibilityView:
      type: object
      properties:
        server_version: {type: string}
        min_supported_agent_version: {type: string}
        rows:
          type: array
          items:
            type: object
            properties:
              agent_version: {type: string}
              agents: {type: integer, description: Сколько агентов флота на этой версии}
              support: {type: string, enum: [supported, deprecated, unsupported]}

    Incident:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        type: {type: string, description: 'agent_offline | agent_flapping | service_down_after_deploy | failed_rules | config_test_failed | high_kernel_drops | disk_full | clock_skew | agent_outdated | agent_update_failed | drift_timeout'}
        severity: {type: string, enum: [info, warning, critical]}
        status: {type: string, enum: [open, ack, resolved]}
        fingerprint: {type: string, description: Ключ дедупликации}
        context: {type: object}
        recommendation: {type: string, nullable: true}
        host_id: {type: string, format: uuid, nullable: true}
        instance_id: {type: string, format: uuid, nullable: true}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time, nullable: true}

    # ------ Конфигурации ------

    ConfigProfile:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        scope_type: {type: string, enum: [cluster, host, instance]}
        scope_id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid, nullable: true, description: Родительский профиль (наследование)}
        content_yaml: {type: string, description: Текущее содержимое (последняя версия)}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ConfigProfileInput:
      type: object
      required: [name, scope_type, scope_id, content_yaml]
      properties:
        name: {type: string}
        description: {type: string}
        scope_type: {type: string, enum: [cluster, host, instance]}
        scope_id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid}
        content_yaml: {type: string}

    ConfigProfileUpdateInput:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        content_yaml: {type: string, description: Изменение содержимого создаёт новую версию}

    ConfigProfileVersion:
      type: object
      properties:
        version: {type: integer}
        content_yaml: {type: string}
        created_by: {type: string, nullable: true}
        created_at: {type: string, format: date-time}

    RenderResult:
      type: object
      properties:
        rendered_yaml: {type: string}
        sources:
          type: array
          description: Цепочка наследования, от кластера к инстансу
          items:
            type: object
            properties:
              profile_id: {type: string, format: uuid}
              name: {type: string}
              scope_type: {type: string}

    DiffResult:
      type: object
      properties:
        from: {type: integer}
        to: {type: integer}
        diff: {type: string, description: Unified diff}

    # ------ Администрирование ------

    UserRoleAssignment:
      type: object
      properties:
        role_id: {type: string, format: uuid}
        role_name: {type: string}
        scope_type: {type: string, enum: [organization, clusters]}
        cluster_ids: {type: array, items: {type: string, format: uuid}}

    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        is_active: {type: boolean}
        is_break_glass: {type: boolean}
        provider_id: {type: string, format: uuid, nullable: true, description: NULL — локальный пользователь}
        last_login_at: {type: string, format: date-time, nullable: true}
        roles: {type: array, items: {$ref: '#/components/schemas/UserRoleAssignment'}}
        created_at: {type: string, format: date-time}

    UserInput:
      type: object
      required: [email, display_name, password]
      properties:
        email: {type: string, format: email}
        display_name: {type: string}
        password: {type: string, format: password}
        is_break_glass: {type: boolean, default: false}
        roles:
          type: array
          items:
            type: object
            required: [role_id]
            properties:
              role_id: {type: string, format: uuid}
              scope_type: {type: string, enum: [organization, clusters], default: organization}
              cluster_ids: {type: array, items: {type: string, format: uuid}}

    UserUpdateInput:
      type: object
      properties:
        display_name: {type: string}
        is_active: {type: boolean}
        password: {type: string, format: password, writeOnly: true, description: 'Смена пароля (минимум 8 символов)'}
        roles:
          type: array
          description: Полная замена назначений (пустой массив — снять все роли)
          items:
            type: object
            required: [role_id]
            properties:
              role_id: {type: string, format: uuid}
              scope_type: {type: string, enum: [organization, clusters]}
              cluster_ids: {type: array, items: {type: string, format: uuid}}

    Role:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid, nullable: true, description: NULL — встроенная роль}
        name: {type: string}
        description: {type: string, nullable: true}
        permissions: {type: array, items: {type: string}, description: 'rules.read, rules.write, deployments.create, ...'}
        is_builtin: {type: boolean}
        created_at: {type: string, format: date-time}

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: {type: string}
        description: {type: string}
        permissions: {type: array, items: {type: string}}

    SsoProvider:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [oidc, saml, ldap]}
        enabled: {type: boolean}
        config:
          type: object
          description: 'OIDC-конфигурация: issuer_url, client_id, redirect_url, scopes. client_secret в ответах обнуляется (writeOnly)'
        group_role_mapping: {type: object, description: 'Маппинг групп IdP → роли: {"<группа>": ["<role_uuid>"]}'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SsoProviderInput:
      type: object
      required: [name, config]
      properties:
        name: {type: string}
        type: {type: string, enum: [oidc], default: oidc, description: 'Пока поддерживается только oidc'}
        enabled: {type: boolean, default: true}
        config:
          type: object
          required: [issuer_url, client_id, redirect_url]
          properties:
            issuer_url: {type: string, description: 'OIDC issuer (discovery URL)'}
            client_id: {type: string}
            client_secret: {type: string, writeOnly: true, description: 'хранится, не возвращается'}
            redirect_url: {type: string, description: '<базовый URL сервера>/api/v1/auth/sso/callback — регистрируется в IdP'}
            scopes: {type: array, items: {type: string}, description: 'пусто → openid email profile'}
        group_role_mapping: {type: object, description: '{"<группа IdP>": ["<role_uuid>"]}'}

    SsoProviderUpdateInput:
      type: object
      properties:
        name: {type: string}
        enabled: {type: boolean}
        config:
          type: object
          description: 'Пустой client_secret — «не менять» (сохраняется старый)'
          properties:
            issuer_url: {type: string}
            client_id: {type: string}
            client_secret: {type: string, writeOnly: true}
            redirect_url: {type: string}
            scopes: {type: array, items: {type: string}}
        group_role_mapping: {type: object}

    ApiToken:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time, nullable: true}
        last_used_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    ApiTokenInput:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string}
        scopes: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}

    ApiTokenCreated:
      allOf:
        - {$ref: '#/components/schemas/ApiToken'}
        - type: object
          properties:
            token: {type: string, description: Значение токена — показывается один раз}

    AuditLogEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        actor_type: {type: string, enum: [user, api_token, system, agent]}
        actor_name: {type: string, nullable: true}
        action: {type: string, description: 'rules.create, deployments.pause, auth.login, ...'}
        object_type: {type: string, nullable: true}
        object_id: {type: string, format: uuid, nullable: true}
        result: {type: string, enum: [success, denied, error]}
        reason: {type: string, nullable: true, description: Причина отказа/ошибки}
        ip: {type: string, nullable: true}
        user_agent: {type: string, nullable: true}
        params: {type: object, nullable: true}
        diff: {type: object, nullable: true, description: '{"before": {...}, "after": {...}}'}

    ChainVerifyResult:
      type: object
      properties:
        checked: {type: integer, description: Записей проверено}
        chained: {type: integer, description: Из них в цепочке (hash не пуст)}
        ok: {type: boolean, description: Вилок/расхождений не найдено}
        broken_at: {type: string, format: uuid, nullable: true, description: id первой битой записи}
        reason: {type: string, description: Пояснение (разрыв/выключена)}

    # ------ Страницы (keyset-обёртки) ------

