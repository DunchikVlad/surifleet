        - {name: type, in: query, schema: {type: string, enum: [et_open, et_pro, taxii, stix, misp, generic]}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_feed
      tags: [feeds]
      summary: Подключить фид
      description: "Требуется право: feeds.write. Креды (credentials) — write-only, хранятся шифрованно."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feed'}
        default: {$ref: '#/components/responses/Error'}

  /feeds/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_feed
      tags: [feeds]
      summary: Карточка фида
      description: "Требуется право: feeds.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feed'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_feed
      tags: [feeds]
      summary: Изменить фид
      description: "Требуется право: feeds.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_feed
      tags: [feeds]
      summary: Отключить и удалить фид
      description: "Требуется право: feeds.write. Импортированные правила и IOC остаются (feed_id → NULL по FK), история запусков удаляется каскадом."
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  /feeds/{id}/sync:
    post:
      operationId: sync_feed
      tags: [feeds]
      summary: Синхронизировать фид (вне расписания)
      description: >
        Требуется право: feeds.write. Выполняется СИНХРОННО: HTTP GET → разбор
        → идемпотентный импорт. Коннекторы: type=generic — IOC-лист
        (plain text / CSV / JSON, тип IOC угадывается) → upsert в iocs по
        (org, type, value); source = имя фида, feed_id = id фида. type=et_open —
        фид ПРАВИЛ ET Open (.rules-файл; URL по умолчанию при создании —
        https://rules.emergingthreats.net/open/suricata/rules/emerging-all.rules)
        → upsert в репозиторий rules по (org, sid) с source_type=et_open и
        feed_id фида; выключенные в фиде правила («#alert ...») создаются со
        status=disabled, активные — under_review; тюнинг аналитика
        (status/priority/threshold/tags) и первичный source_type/feed_id
        существующих правил импорт не перетирает. type=et_pro — то же для
        ET Pro: код подписки берётся из credentials (просто код, без
        user:pass; без кода — failed с пояснением), пустой URL строится как
        https://rules.emergingthreatspro.com/<code>/suricata/rules/etpro-all.rules,
        source_type=et_pro. type=taxii — TAXII 2.x/STIX: URL —
        endpoint объектов коллекции (.../collections/{id}/objects/) или
        API root сервера (тогда discovery: GET {url}/collections/ → объекты
        всех коллекций с can_read); пагинация more/next; credentials —
        "user:pass" (Basic) или токен (Bearer); разбираются только
        indicator с pattern_type stix (revoked и истёкшие по valid_until
        пропускаются; confidence → score, valid_until → expires_at),
        сравнения ipv4/ipv6-addr, domain-name, url, email-addr,
        file:hashes.MD5/SHA-1/SHA-256 → upsert в iocs. type=stix — то же
        для статического STIX bundle/JSON-массива по URL (без
        TAXII-протокола). type=misp — MISP core format feed: URL — базовый
        адрес фида, загружаются manifest.json и файлы событий
        {uuid}.json (свежие первыми по timestamp, предел 2000 событий);
        атрибуты с to_ids=false/deleted пропускаются; типы ip-src/ip-dst,
        domain/hostname, url, md5/sha1/sha256, email-* (+ составные
        domain|ip, ip-*|port, filename|hash); score по threat_level_id
        события (1→80, 2→60, 3→40, прочее→50). Ошибки загрузки/разбора
        — не 5xx, а status=failed + error
        в теле (дублируются в last_error фида). После успешного импорта
        IOC-фида (generic, taxii, stix, misp) — автопрогон генерации
        Suricata-правил из активных IOC
        (ruleset ioc-current-*, БЕЗ деплоя; счётчики rules_*); для
        et_open/et_pro автопрогон не выполняется (фид сам импортирует правила).
      parameters:
        - {$ref: '#/components/parameters/PathId'}
      responses:
        '200':
          description: Синхронизация выполнена (итог — в теле, включая status=failed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedRun'}
        default: {$ref: '#/components/responses/Error'}

  /feeds/{id}/runs:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: list_feed_runs
      tags: [feeds]
      summary: История запусков синхронизации
      description: "Требуется право: feeds.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedRunPage'}
        default: {$ref: '#/components/responses/Error'}

  # --------------------------------------------------------------------------
  # IOC
  # --------------------------------------------------------------------------

  /iocs:
    get:
      operationId: list_iocs
      tags: [iocs]
      summary: Список IOC
      description: "Требуется право: iocs.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: type, in: query, schema: {type: string, enum: [ip, domain, url, md5, sha1, sha256, email]}}
        - {name: status, in: query, schema: {type: string, enum: [active, under_review, expired, revoked]}}
        - {name: source, in: query, description: Источник (имя фида или ручной), schema: {type: string}}
        - {name: q, in: query, description: Поиск по значению, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IocPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: create_ioc
      tags: [iocs]
      summary: Создать IOC вручную
      description: "Требуется право: iocs.write"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IocInput'}
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ioc'}
        default: {$ref: '#/components/responses/Error'}

  /iocs/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_ioc
      tags: [iocs]
      summary: Карточка IOC
      description: "Требуется право: iocs.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ioc'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: update_ioc
      tags: [iocs]
      summary: Изменить IOC (скоринг, статус, срок жизни)
      description: "Требуется право: iocs.write. Смена status на revoked отзывает сгенерированное из IOC правило (source_type=ioc → status=disabled + тег ioc-revoked)."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IocUpdateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ioc'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_ioc
      tags: [iocs]
      summary: Удалить IOC
      description: "Требуется право: iocs.write. Жёсткое удаление; сгенерированное из IOC правило отзывается (status=disabled + тег ioc-revoked)."
      responses:
        '204': {description: Удалено}
        default: {$ref: '#/components/responses/Error'}

  /iocs/generate:
    post:
      operationId: generate_ioc_rules
      tags: [iocs]
      summary: Сгенерировать Suricata-правила из активных IOC (bulk)
      description: >
        Требуется право: iocs.write (+ deployments.write при deploy=true).
        Bulk-реализация идеи "deploy IOC" из ТЗ: перед генерацией выполняется
        свип просроченных IOC (active с expires_at < now() → expired).
        Из всех активных IOC детерминированно генерируются Suricata-правила
        (sid 8800000..8899999 — FNV-1a от (type,value), идемпотентно;
        коллизии разрешаются линейным пробингом). Маппинг: ip → alert ip,
        domain → dns.query content, url → http.host+http.uri; hash-типы и
        email пропускаются с причиной в skipped. Правила пишутся в
        репозиторий как source=ioc и сразу enabled. Если есть хоть одно
        enabled ioc-правило, собирается content-addressed ruleset с именем
        "ioc-current-<sha8>" (тот же состав → та же версия, без дублей; имя
        включает префикс sha256, т.к. version уникально в пределах орг). Деплой
        на инстансы — только по явному deploy=true с targeting (общий
        волновой конвейер POST /deployments).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IocGenerateInput'}
      responses:
        '200':
          description: Результат генерации (+ ruleset, + деплой при deploy=true)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IocGenerateResult'}
        default: {$ref: '#/components/responses/Error'}

  /iocs/import:
    post:
      operationId: import_iocs
      tags: [iocs]
      summary: Импорт IOC списком (JSON)
      description: "Требуется право: iocs.write. Идемпотентно по (org, type, value): новые — imported, существующие — updated (score/source/expires_at; status не перетирается). Ошибочные элементы не прерывают импорт."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                source: {type: string, description: Источник по умолчанию для элементов без своего source}
                items:
                  type: array
                  items: {$ref: '#/components/schemas/IocInput'}
      responses:
        '200':
          description: Статистика импорта
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResult'}
        default: {$ref: '#/components/responses/Error'}

