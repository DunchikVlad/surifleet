        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: build_ruleset
      tags: [rulesets]
      summary: Собрать версию ruleset из выбранных правил (блоб → S3)
      description: "Требуется право: deployments.write. Идемпотентно по заголовку Idempotency-Key; одинаковый состав даёт тот же sha256 (content-addressed)."
      parameters:
