        - {$ref: '#/components/parameters/PathId'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        default: {$ref: '#/components/responses/Error'}

  # --------------------------------------------------------------------------
  # Конфигурации
  # --------------------------------------------------------------------------

  /config_profiles:
    get:
      operationId: list_config_profiles
      tags: [config_profiles]
      summary: Список профилей конфигурации
      description: "Требуется право: config.read"
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: scope_type, in: query, schema: {type: string, enum: [cluster, host, instance]}}
