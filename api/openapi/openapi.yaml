        - {name: severity, in: query, schema: {type: string, enum: [info, warning, critical]}}
        - {name: type, in: query, schema: {type: string}}
        - {name: host_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentPage'}
        default: {$ref: '#/components/responses/Error'}

  /incidents/{id}:
    parameters:
      - {$ref: '#/components/parameters/PathId'}
    get:
      operationId: get_incident
      tags: [incidents]
      summary: Карточка инцидента (контекст, рекомендация)
      description: "Требуется право: incidents.read"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        default: {$ref: '#/components/responses/Error'}

  /incidents/{id}/ack:
    post:
      operationId: ack_incident
