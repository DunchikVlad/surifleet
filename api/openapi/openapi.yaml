      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        default: {$ref: '#/components/responses/Error'}

  /incidents/{id}/resolve:
    post:
      operationId: resolve_incident
