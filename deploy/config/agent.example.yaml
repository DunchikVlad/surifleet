# Пример конфигурации агента SuriFleet.
# Путь: --config или env SURIFLEET_CONFIG.
# Переопределение через env: SURIFLEET_AGENT_SERVER_ADDR и т.п.

agent:
  # Адрес Hub-узла сервера (исходящее mTLS-подключение; после enrollment
  # приоритет у hub_endpoints из ответа сервера)
  server_addr: "localhost:8443"
  # Адрес enrollment-сервиса (обычный TLS; нужен только при первом запуске)
  enroll_addr: "localhost:8444"
  # Одноразовый join token (POST /api/v1/clusters/{id}/join_tokens).
  # Нужен только пока нет сертификата в data_dir; после enrollment можно стереть.
  join_token: ""

  # mTLS-материал и agent_id сохраняются в data_dir после enrollment:
  # agent.crt.pem (0644), agent.key.pem (0600), ca.pem (0644), agent_id
  cert_file: ""
  key_file: ""
  ca_file: ""

  # Рабочий каталог агента (буферы, журнал обработанных task_id)
  data_dir: "./data"
  # Файл лога; пусто → <data_dir>/agent.log
  log_file: ""

  # Ротация локального лога (lumberjack)
  log_max_size_mb: 100
  log_max_backups: 5
  log_max_age_days: 30

  # Переподключение: exponential backoff backoff_min → ×2 → backoff_max,
  # полный jitter (защита от reconnect-штормов)
  backoff_min: "1s"
  backoff_max: "60s"

  # Интервалы по умолчанию (сервер может переопределить в HelloAck)
  heartbeat_interval: "30s"
  state_report_interval: "5m"
  metrics_interval: "1m"

  # debug | info | warn | error (сервер может менять на лету)
  log_level: info

  # Пересылка EVE-алертов Suricata в SIEM (чанк 45, п. 5.4). Агент читает
  # eve.json инстанса и пересылает события event_type=alert в SIEM по syslog.
  # siem_addr пустой — пересылка выключена.
  # siem_addr: "siem.example.com:514"
  # siem_protocol: udp     # udp (RFC 5426) | tcp (RFC 6587 octet-counting)
  # siem_format: cef       # cef (Common Event Format) | json (сырой eve alert)
