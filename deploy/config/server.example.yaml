# Пример конфигурации сервера SuriFleet.
# Путь: --config или env SURIFLEET_CONFIG.
# Переопределение любого параметра через env: SURIFLEET_SERVER_HTTP_ADDR,
# SURIFLEET_SERVER_S3_ENDPOINT и т.п. (вложенность — через _).

server:
  # Роль процесса: api | hub | all (один бинарь, роли масштабируются отдельно)
  role: all

  # REST API (chi) — роль api|all
  http_addr: ":8080"
  # gRPC Hub для стримов агентов (mTLS, CN сертификата = agent_id) — роль hub|all
  grpc_addr: ":8443"
  # Enrollment (обычный TLS, БЕЗ клиентского сертификата; join token) — все роли
  enroll_addr: ":8444"
  # Отдельный listener Prometheus-метрик (все роли)
  metrics_addr: ":9090"

  # Встроенный CA: создаётся при первом старте, хранится здесь (0700/0600)
  ca_dir: "./data/ca"
  # Адреса Hub, которые агенты получают в ответе Enroll (внешние, с точки зрения агента)
  hub_endpoints: ["192.168.31.28:8443"]
  # SAN серверного сертификата Hub/Enrollment: все адреса, по которым агенты
  # обращаются к серверу (иначе TLS-верификация на агенте не пройдёт)
  cert_sans: ["localhost", "127.0.0.1", "192.168.31.28"]

  # Тестовый контур 192.168.31.28 (docker-стек из deploy/docker-compose.yml).
  # Для сервера, запущенного на самом .28, можно заменить хост на localhost.
  postgres_dsn: "postgres://surifleet:surifleet_dev@192.168.31.28:5432/surifleet?sslmode=disable"
  redis_addr: "192.168.31.28:6379"
  nats_url: "nats://192.168.31.28:4222"
  # Внимание: нативный порт ClickHouse на .28 опубликован как 9900
  # (9000 занят MinIO API) — см. deploy/docker-compose.yml.
  clickhouse_dsn: "clickhouse://192.168.31.28:9900/surifleet"

  s3:
    endpoint: "192.168.31.28:9000"
    bucket: "surifleet-rulesets"
    use_ssl: false
    # Ключи ТОЛЬКО через env (в репозиторий не кладём):
    #   SURIFLEET_SERVER_S3_ACCESS_KEY=minioadmin
    #   SURIFLEET_SERVER_S3_SECRET_KEY=minioadmin

  # debug | info | warn | error
  log_level: info
