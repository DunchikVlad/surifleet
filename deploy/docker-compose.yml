# SuriFleet — тестовый стек для оценки и разработки (ТЗ п. 13).
# Хост: 192.168.31.28 (2 vCPU, 3.3 ГБ RAM). Все сервисы слушают 0.0.0.0 —
# это закрытая тестовая LAN, для прода потребуется пересмотр портов и секретов.
#
# Запуск:  cp .env.example .env  (и сменить пароли)
#          docker compose up -d
# Статус:  docker compose ps
#
# ВНИМАНИЕ по портам: у ClickHouse нативный TCP-протокол тоже 9000 — он
# конфликтует с API MinIO на хосте. Поэтому наружу ClickHouse-native
# опубликован как 9900 (MinIO API занимает 9000, как требует ТЗ).

name: surifleet

services:
  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: surifleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: surifleet
      POSTGRES_USER: surifleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      # Экономим память на слабом хосте (дефолт shared_buffers=128MB оставляем,
      # но ограничиваем контейнер целиком — см. mem_limit).
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surifleet -d surifleet"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m

  # --------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: surifleet-redis
    restart: unless-stopped
    # appendonly — чтобы переживать рестарт; maxmemory — защита хоста от ООМ.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 128m

  # ---------------------------------------------------------------------- NATS
  nats:
    image: nats:2.10-alpine
    container_name: surifleet-nats
    restart: unless-stopped
    # -js: включаем JetStream; -sd: каталог хранения на named volume;
    # -m 8222: HTTP-мониторинг (используется healthcheck'ом, наружу не публикуем).
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "0.0.0.0:4222:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m

  # ---------------------------------------------------------------- ClickHouse
  # Тег зафиксирован на 24.8 (LTS): latest (26.x) собран с baseline x86-64-v3
  # и падает с Illegal instruction на CPU без AVX (гипервизор KVM на .28
  # маскирует AVX-флаги, хотя физический i7-6700 их имеет).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: surifleet-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: surifleet
      # Пользователь default без пароля — допустимо только в тестовой LAN.
    ports:
      - "0.0.0.0:8123:8123"   # HTTP-интерфейс (ping, запросы)
      - "0.0.0.0:9900:9000"   # нативный TCP (на хосте 9900, т.к. 9000 занят MinIO)
    volumes:
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 24          # ClickHouse стартует дольше всех
      start_period: 20s
    mem_limit: 1g          # самый прожорливый сервис стека

  # --------------------------------------------------------------------- MinIO
  # Образы берём с quay.io: MinIO удалил свои репозитории с Docker Hub.
  minio:
    image: quay.io/minio/minio:latest
    container_name: surifleet-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?задайте MINIO_ROOT_USER в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}
    ports:
      - "0.0.0.0:9000:9000"   # S3 API
      - "0.0.0.0:9001:9001"   # веб-консоль
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m

  # Разовый init-контейнер: создаёт бакет surifleet-rulesets после того,
  # как MinIO станет healthy. Не является сервисом — restart: "no" осознанно.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: surifleet-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/surifleet-rulesets &&
      echo 'bucket surifleet-rulesets ready'
      "

volumes:
  pg_data:
  redis_data:
  nats_data:
  ch_data:
  minio_data:
